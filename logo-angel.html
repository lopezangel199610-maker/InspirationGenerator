        let currentDesign = designs[0];

        function init() {
            renderGrid();
            applyDesign(designs[0]);
        }

        function renderGrid(category = 'all') {
            const grid = document.getElementById('styleGrid');
            filteredDesigns = category === 'all' ? [...designs] : designs.filter(d => d.cat === category);

            grid.innerHTML = filteredDesigns.map(design => {
                const wing = wings[design.wing];
                return `
                    <div class="style-card ${design.id === currentDesign.id ? 'active' : ''}"
                         onclick="selectDesign(${design.id})" data-id="${design.id}">
                        <div class="card-preview" style="font-family: ${design.font}; font-weight: ${design.weight || 400};">
                            <span class="mini-wing" style="transform: scaleX(-1)">${wing.left}</span>
                            <span>${design.text}</span>
                            <span class="mini-wing">${wing.right}</span>
                        </div>
                        <div class="card-name">${design.cat}</div>
                    </div>
                `;
            }).join('');

            updateInfo();
        }

        function filterByCategory(category = 'all', btn = null) {
            if (btn) {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                btn.classList.add('active');
            }
            document.getElementById('categorySelect').value = category;
            renderGrid(category);
        }

        function selectDesign(id) {
            const design = designs.find(d => d.id === id);
            if (design) {
                currentDesign = design;
                applyDesign(design);
                updateActiveCard();
                updateInfo();
            }
        }

        function applyDesign(design) {
            const wing = wings[design.wing];

            document.getElementById('wingLeft').textContent = wing.left;
            document.getElementById('wingRight').textContent = wing.right;
            document.getElementById('wingLeft').style.fontSize = (design.size * 0.9) + 'px';
            document.getElementById('wingRight').style.fontSize = (design.size * 0.9) + 'px';

            const logoText = document.getElementById('logoText');
            logoText.textContent = design.text;
            logoText.style.fontFamily = design.font;
            logoText.style.fontSize = design.size + 'px';
            logoText.style.fontWeight = design.weight || 400;
            logoText.style.color = textColor;

            document.getElementById('wingLeft').style.color = wingColor;
            document.getElementById('wingRight').style.color = wingColor;

            const logoSub = document.getElementById('logoSub');
            if (design.sub) {
                logoSub.style.display = 'block';
                logoSub.textContent = design.sub;
                logoSub.style.fontSize = design.subSize + 'px';
                logoSub.style.color = subColor;
            } else {
                logoSub.style.display = 'none';
            }
        }

        function updateActiveCard() {
            document.querySelectorAll('.style-card').forEach(card => {
                card.classList.toggle('active', parseInt(card.dataset.id) === currentDesign.id);
            });
        }

        function updateInfo() {
            const index = filteredDesigns.findIndex(d => d.id === currentDesign.id) + 1;
            document.getElementById('variationInfo').textContent =
                `Diseño ${index || 1} de ${filteredDesigns.length}`;
        }

        function randomize() {
            const randomIndex = Math.floor(Math.random() * filteredDesigns.length);
            const design = filteredDesigns[randomIndex];
            currentDesign = design;
            applyDesign(design);
            updateActiveCard();
            updateInfo();

            const card = document.querySelector(`.style-card[data-id="${design.id}"]`);
            if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function setBg(type) {
            const container = document.getElementById('previewContainer');
            container.classList.remove('dark-bg', 'transparent-bg');
            if (type === 'dark') container.classList.add('dark-bg');
            else if (type === 'transparent') container.classList.add('transparent-bg');
        }

        function updateColors() {
            textColor = document.getElementById('textColor').value;
            wingColor = document.getElementById('wingColor').value;
            subColor = document.getElementById('subColor').value;

            document.getElementById('logoText').style.color = textColor;
            document.getElementById('wingLeft').style.color = wingColor;
            document.getElementById('wingRight').style.color = wingColor;
            document.getElementById('logoSub').style.color = subColor;
        }

        function showNotice(text) {
            const notice = document.getElementById('notice');
            notice.textContent = text;
            notice.classList.add('show');
            setTimeout(() => notice.classList.remove('show'), 2000);
        }

        function downloadSVG() {
            const size = parseInt(document.getElementById('sizeSelect').value);
            const design = currentDesign;
            const wing = wings[design.wing];

            const fontSize = (design.size / 85) * size * 0.12;
            const wingSize = fontSize * 0.9;
            const subFontSize = (design.subSize / 14) * size * 0.025;

            let subSVG = '';
            if (design.sub) {
                subSVG = `<text x="50%" y="75%" font-family="'Segoe UI', sans-serif" font-size="${subFontSize}" fill="${subColor}" text-anchor="middle" letter-spacing="5">${escapeXml(design.sub)}</text>`;
            }

            const svg = `<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size * 0.5}" viewBox="0 0 ${size} ${size * 0.5}">
    <text x="25%" y="50%" font-size="${wingSize}" fill="${wingColor}" text-anchor="middle" dominant-baseline="middle" transform="scale(-1,1) translate(-${size * 0.5},0)">${wing.left}</text>
    <text x="50%" y="50%" font-family="${design.font}" font-size="${fontSize}" font-weight="${design.weight || 400}" fill="${textColor}" text-anchor="middle" dominant-baseline="middle">${escapeXml(design.text)}</text>
    <text x="75%" y="50%" font-size="${wingSize}" fill="${wingColor}" text-anchor="middle" dominant-baseline="middle">${wing.right}</text>
    ${subSVG}
</svg>`;

            const blob = new Blob([svg], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.download = 'Angel-logo.svg';
            link.href = url;
            link.click();
            URL.revokeObjectURL(url);
            showNotice('SVG Bajado!');
        }

        function escapeXml(text) {
            return text.replace(/[<>&'"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;',"'":'&apos;','"':'&quot;'}[c]));
        }

        function downloadPNG() {
            const size = parseInt(document.getElementById('sizeSelect').value);
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size * 0.5;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawToCanvas(ctx, size);

            const link = document.createElement('a');
            link.download = 'Angel-logo.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
            showNotice('PNG Bajado!');
        }

        function downloadPNGTransparent() {
            const size = parseInt(document.getElementById('sizeSelect').value);
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size * 0.5;
            const ctx = canvas.getContext('2d');

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawToCanvas(ctx, size);

            const link = document.createElement('a');
            link.download = 'Angel-logo-transparent.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
            showNotice('PNG Transparente Bajado!');
        }

        function drawToCanvas(ctx, size) {
            const design = currentDesign;
            const wing = wings[design.wing];
            const height = size * 0.5;

            const fontSize = (design.size / 85) * size * 0.11;
            const wingSize = fontSize * 0.85;

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // Left wing (mirrored)
            ctx.save();
            ctx.translate(size * 0.2, height * 0.45);
            ctx.scale(-1, 1);
            ctx.font = `${wingSize}px serif`;
            ctx.fillStyle = wingColor;
            ctx.fillText(wing.left, 0, 0);
            ctx.restore();

            // Main text
            ctx.font = `${design.weight || 400} ${fontSize}px ${design.font.replace(/'/g, '')}`;
            ctx.fillStyle = textColor;
            ctx.fillText(design.text, size * 0.5, height * 0.45);

            // Right wing
            ctx.font = `${wingSize}px serif`;
            ctx.fillStyle = wingColor;
            ctx.fillText(wing.right, size * 0.8, height * 0.45);

            // Subtext
            if (design.sub) {
                const subFontSize = (design.subSize / 14) * size * 0.022;
                ctx.font = `${subFontSize}px 'Segoe UI', sans-serif`;
                ctx.fillStyle = subColor;
                ctx.fillText(design.sub, size * 0.5, height * 0.75);
            }
        }

                    document.getElementById('installBtn').style.display = 'none';
                });
            }
        }

        // Register service worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./service-worker.js')
                .then(reg => console.log('SW registered'))
                .catch(err => console.log('SW registration failed:', err));
        }
    </script>
</body>
</html>

        let currentStyle = logoStyles[0];
        let currentIndex = 0;
        let filteredStyles = [...logoStyles];
        let mainColor = '#1a1a2e';
        let subColor = '#666666';

        function init() {
            renderStyleGrid();
            applyStyle(logoStyles[0]);
        }

        function renderStyleGrid(category = 'all') {
            const grid = document.getElementById('styleGrid');
            filteredStyles = category === 'all'
                ? [...logoStyles]
                : logoStyles.filter(s => s.category === category);

            grid.innerHTML = filteredStyles.map((style, index) => `
                <div class="style-card ${style.id === currentStyle.id ? 'active' : ''}"
                     onclick="selectStyle(${style.id})" data-id="${style.id}">
                    <div class="card-preview" style="font-family: ${style.font}; font-weight: ${style.weight || 400}; line-height: ${style.stacked ? '0.85' : '1'}; font-size: ${style.stacked ? '18px' : '24px'};">
                        ${style.stacked ? style.main.split('\n').join('<br>') : style.main}
                    </div>
                    <div class="card-name">${style.category}</div>
                </div>
            `).join('');

            updateCounter();
        }

        function filterStyles(category) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderStyleGrid(category);
        }

        function selectStyle(id) {
            const style = logoStyles.find(s => s.id === id);
            if (style) {
                currentStyle = style;
                currentIndex = filteredStyles.findIndex(s => s.id === id);
                applyStyle(style);
                updateActiveCard();
                updateCounter();
            }
        }

        function applyStyle(style) {
            const main = document.getElementById('logoMain');
            const sub = document.getElementById('logoSub');

            main.style.fontFamily = style.font;
            main.style.fontSize = style.mainSize + 'px';
            main.style.fontWeight = style.weight || 400;
            main.style.color = mainColor;

            // Handle stacked text (R\nE\nA)
            if (style.stacked) {
                main.innerHTML = style.main.split('\n').join('<br>');
                main.style.lineHeight = '0.9';
            } else {
                main.textContent = style.main;
                main.style.lineHeight = '1.1';
            }

            if (style.sub) {
                sub.style.display = 'block';
                sub.style.fontSize = style.subSize + 'px';
                sub.style.letterSpacing = style.spacing + 'px';
                sub.style.color = subColor;
                sub.textContent = style.sub;
                sub.style.marginTop = style.stacked ? '15px' : '8px';
            } else {
                sub.style.display = 'none';
            }
        }

        function updateActiveCard() {
            document.querySelectorAll('.style-card').forEach(card => {
                card.classList.toggle('active', parseInt(card.dataset.id) === currentStyle.id);
            });
        }

        function updateCounter() {
            const index = filteredStyles.findIndex(s => s.id === currentStyle.id) + 1;
            document.getElementById('variationCounter').textContent =
                `Variación ${index || 1} de ${filteredStyles.length}`;
        }

        function randomize() {
            const randomIndex = Math.floor(Math.random() * filteredStyles.length);
            const style = filteredStyles[randomIndex];
            currentStyle = style;
            currentIndex = randomIndex;
            applyStyle(style);
            updateActiveCard();
            updateCounter();

            // Scroll to card
            const card = document.querySelector(`.style-card[data-id="${style.id}"]`);
            if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        document.getElementById('generateBtn').addEventListener('click', randomize);

        function setBg(type) {
            const container = document.getElementById('previewContainer');
            container.classList.remove('dark-bg', 'transparent-bg');
            if (type === 'dark') container.classList.add('dark-bg');
            else if (type === 'transparent') container.classList.add('transparent-bg');
        }

        function updateColors() {
            mainColor = document.getElementById('mainColor').value;
            subColor = document.getElementById('subColor').value;
            document.getElementById('logoMain').style.color = mainColor;
            document.getElementById('logoSub').style.color = subColor;
        }

        function showNotice(text) {
            const notice = document.getElementById('notice');
            notice.textContent = text;
            notice.classList.add('show');
            setTimeout(() => notice.classList.remove('show'), 2000);
        }

        function downloadSVG() {
            const size = parseInt(document.getElementById('sizeSelect').value);
            const style = currentStyle;
            const subText = style.sub;

            const mainFontSize = (style.mainSize / 90) * size * 0.22;
            const subFontSize = (style.subSize / 14) * size * 0.035;
            const height = style.stacked ? size * 0.7 : size * 0.5;

            let mainTextSVG = '';
            if (style.stacked) {
                const lines = style.main.split('\n');
                const lineHeight = mainFontSize * 0.95;
                const startY = height * 0.25;
                mainTextSVG = lines.map((line, i) => `
                    <text x="50%" y="${startY + (i * lineHeight)}"
                        font-family="${style.font}"
                        font-size="${mainFontSize}"
                        font-weight="${style.weight || 400}"
                        fill="${mainColor}"
                        text-anchor="middle">${escapeXml(line)}</text>`).join('');
            } else {
                mainTextSVG = `<text x="50%" y="45%"
                    font-family="${style.font}"
                    font-size="${mainFontSize}"
                    font-weight="${style.weight || 400}"
                    fill="${mainColor}"
                    text-anchor="middle"
                    dominant-baseline="middle">${escapeXml(style.main)}</text>`;
            }

            let subtextSVG = '';
            if (subText) {
                const subY = style.stacked ? '85%' : '72%';
                subtextSVG = `<text x="50%" y="${subY}"
                    font-family="'Segoe UI', sans-serif"
                    font-size="${subFontSize}"
                    fill="${subColor}"
                    text-anchor="middle"
                    letter-spacing="${style.spacing * 0.5}">${escapeXml(subText)}</text>`;
            }

            const svg = `<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${height}" viewBox="0 0 ${size} ${height}">
    ${mainTextSVG}
    ${subtextSVG}
</svg>`;

            const blob = new Blob([svg], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.download = 'REA-logo.svg';
            link.href = url;
            link.click();
            URL.revokeObjectURL(url);
            showNotice('SVG Bajado!');
        }

        function escapeXml(text) {
            return text.replace(/[<>&'"]/g, c => ({
                '<': '&lt;', '>': '&gt;', '&': '&amp;', "'": '&apos;', '"': '&quot;'
            }[c]));
        }

        function downloadPNG() {
            const size = parseInt(document.getElementById('sizeSelect').value);
            const height = currentStyle.stacked ? size * 0.7 : size * 0.5;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = height;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawLogoToCanvas(ctx, size);

            const link = document.createElement('a');
            link.download = 'REA-logo.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
            showNotice('PNG Bajado!');
        }

        function downloadPNGTransparent() {
            const size = parseInt(document.getElementById('sizeSelect').value);
            const height = currentStyle.stacked ? size * 0.7 : size * 0.5;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = height;
            const ctx = canvas.getContext('2d');

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawLogoToCanvas(ctx, size);

            const link = document.createElement('a');
            link.download = 'REA-logo-transparent.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
            showNotice('PNG Transparente Bajado!');
        }

        function drawLogoToCanvas(ctx, size) {
            const style = currentStyle;
            const height = style.stacked ? size * 0.7 : size * 0.5;

            // Main text
            const mainFontSize = (style.mainSize / 90) * size * 0.2;
            ctx.font = `${style.weight || 400} ${mainFontSize}px ${style.font.replace(/'/g, '')}`;
            ctx.fillStyle = mainColor;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            if (style.stacked) {
                const lines = style.main.split('\n');
                const lineHeight = mainFontSize * 0.95;
                const startY = height * 0.2;
                lines.forEach((line, i) => {
                    ctx.fillText(line, size / 2, startY + (i * lineHeight));
                });
            } else {
                ctx.fillText(style.main, size / 2, height * 0.45);
            }

            // Subtext
            if (style.sub) {
                const subFontSize = (style.subSize / 14) * size * 0.032;
                ctx.font = `${subFontSize}px 'Segoe UI', sans-serif`;
                ctx.fillStyle = subColor;
                const subY = style.stacked ? height * 0.88 : height * 0.75;
                ctx.fillText(style.sub, size / 2, subY);
            }
        }

        // Initialize
        init();
        // PWA Install prompt
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installBtn').style.display = 'inline-block';
        });

        function installApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(result => {
                    if (result.outcome === 'accepted') {
                        alert('App instalada!');
                    }
                    deferredPrompt = null;
                    document.getElementById('installBtn').style.display = 'none';
                });
            }
        }

        // Register service worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./service-worker.js')
                .then(reg => console.log('SW registered'))
                .catch(err => console.log('SW registration failed:', err));
        }
    </script>
</body>
</html>

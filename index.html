<html lang="es">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ff6b6b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Diseños">

    <title>Generador de Diseños Chistosos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0f0f1a;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #ff6b6b, #ff8e53);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
        }

        select {
            padding: 12px 20px;
            font-size: 1rem;
            border: 2px solid #3a3a5c;
            border-radius: 25px;
            background: #1a1a2e;
            color: #fff;
            cursor: pointer;
        }

        .generate-btn {
            padding: 15px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, #ff6b6b, #ff8e53);
            color: white;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .generate-btn:hover {
            transform: scale(1.05);
        }

        .two-column {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            align-items: start;
        }

        @media (max-width: 768px) {
            .two-column {
                grid-template-columns: 1fr;
            }
        }

        .column {
            background: #1a1a2e;
            border-radius: 20px;
            padding: 25px;
            border: 2px solid #3a3a5c;
            min-height: 400px;
            display: flex;
            flex-direction: column;
        }

        .column-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .label {
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 5px 12px;
            border-radius: 15px;
            background: linear-gradient(135deg, #ff6b6b, #ff8e53);
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 8px 15px;
            font-size: 0.85rem;
            border: 1px solid #3a3a5c;
            border-radius: 15px;
            background: transparent;
            color: #a0a0c0;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            border-color: #ff6b6b;
            color: #ff6b6b;
        }

        .quote-text {
            font-size: 1.8rem;
            font-weight: 600;
            line-height: 1.4;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .category-tag {
            font-size: 0.85rem;
            color: #ff6b6b;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
            margin-top: 15px;
        }

        .image-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #242442;
            border-radius: 12px;
            min-height: 300px;
            position: relative;
            overflow: hidden;
        }

        .generated-image {
            max-width: 100%;
            max-height: 350px;
            border-radius: 12px;
            display: none;
        }

        .generated-image.loaded {
            display: block;
        }

        .image-with-text {
            position: relative;
            display: inline-block;
        }

        .text-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: Impact, 'Arial Black', sans-serif;
            font-size: 2rem;
            font-weight: 900;
            color: white;
            text-align: center;
            text-shadow: 3px 3px 0 #000, -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000, 3px 0 0 #000, -3px 0 0 #000, 0 3px 0 #000, 0 -3px 0 #000;
            max-width: 90%;
            line-height: 1.2;
            padding: 10px;
        }

        .placeholder {
            text-align: center;
            color: #a0a0c0;
            padding: 40px;
        }

        .placeholder-icon {
            font-size: 3rem;
            margin-bottom: 10px;
            opacity: 0.5;
        }

        .loading {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            color: #a0a0c0;
        }

        .loading.active {
            display: flex;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #3a3a5c;
            border-top-color: #ff6b6b;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .copy-notice {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #4ecdc4;
            color: #0f0f1a;
            padding: 12px 25px;
            border-radius: 25px;
            font-weight: 600;
            transition: transform 0.3s;
            z-index: 100;
        }

        .copy-notice.show {
            transform: translateX(-50%) translateY(0);
        }

        .download-options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #3a3a5c;
        }

        .download-options .btn {
            flex: 1;
            min-width: 100px;
            text-align: center;
        }

        .size-selector {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .size-selector label {
            font-size: 0.85rem;
            color: #a0a0c0;
        }

        .size-selector select {
            padding: 8px 12px;
            font-size: 0.85rem;
            border-radius: 15px;
        }

        .text-style-toggle {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .text-style-toggle .btn {
            flex: 1;
        }

        .text-style-toggle .btn.active {
            background: linear-gradient(135deg, #ff6b6b, #ff8e53);
            color: white;
            border-color: transparent;
        }

        .cricut-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: #2d2d4a;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            color: #4ecdc4;
            margin-left: 10px;
        }

        .section-title {
            font-size: 0.75rem;
            color: #a0a0c0;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .nav-bar {
            display: flex;
            gap: 8px;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .nav-link {
            padding: 8px 16px;
            font-size: 0.85rem;
            border: 2px solid #3a3a5c;
            border-radius: 20px;
            background: transparent;
            color: #a0a0c0;
            text-decoration: none;
            transition: all 0.3s;
            cursor: pointer;
        }

        .nav-link:hover {
            border-color: #ff6b6b;
            color: #ff6b6b;
        }

        .nav-link.active {
            background: linear-gradient(135deg, #ff6b6b, #ff8e53);
            color: white;
            border-color: transparent;
        }

        .install-btn {
            padding: 8px 16px;
            font-size: 0.85rem;
            border: 2px solid #4ecdc4;
            border-radius: 20px;
            background: transparent;
            color: #4ecdc4;
            cursor: pointer;
            transition: all 0.3s;
            display: none;
        }

        .install-btn:hover {
            background: #4ecdc4;
            color: #0f0f1a;
        }
    </style>
</head>

    <div class="container">
        <nav class="nav-bar">
            <a class="nav-link active" href="index.html">Frases</a>
            <a class="nav-link" href="logo-angel.html">Logo Angel</a>
            <a class="nav-link" href="logo-rea.html">Logo REA</a>

        <h1>Generador de Diseños Chistosos <span class="cricut-badge">Print Ready</span></h1>

        <div class="controls">
            <select id="categorySelect">
                <option value="all">Todo / All</option>
                <option value="mexican">Mexicano</option>
                <option value="tacos">Tacos y Comida</option>
                <option value="bebidas">Bebidas y Party</option>
                <option value="flojera">Flojera Mode</option>
                <option value="sarcasmo">Sarcasmo</option>
                <option value="familia">Familia</option>
                <option value="mood">Mood / Vibes</option>
                <option value="adulting">Adulting</option>
                <option value="barrio">Barrio / Calle</option>
            </select>
            <button class="generate-btn" id="generateBtn">Generar</button>
        </div>

        <div class="two-column">
            <div class="column">
                <div class="column-header">
                    <span class="label">Texto</span>
                    <div class="actions">
                        <button class="btn" onclick="copyQuote()">Copiar</button>
                        <button class="btn" onclick="refreshQuote()">Nuevo Texto</button>
                    </div>
                </div>
                <p class="quote-text" id="quoteText">Dale click a "Generar" para empezar!</p>
                <span class="category-tag" id="quoteCategory"></span>

                <div class="section-title">Estilo de Texto (para corte)</div>
                <div class="text-style-toggle">
                    <button class="btn active" id="solidBtn" onclick="setTextStyle('solid')">Sólido</button>
                    <button class="btn" id="outlineBtn" onclick="setTextStyle('outline')">Contorno</button>
                </div>

                <div class="download-options">
                    <button class="btn" onclick="downloadSVG()">Bajar SVG</button>
                    <button class="btn" onclick="downloadTextPNG()">Texto PNG</button>
                </div>
            </div>

            <div class="column">
                <div class="column-header">
                    <span class="label">Imagen</span>
                    <div class="actions">
                        <button class="btn" onclick="regenerateImage()">Nueva Imagen</button>
                    </div>
                </div>
                <div class="image-container">
                    <div class="placeholder" id="placeholder">
                        <div class="placeholder-icon">&#127912;</div>
                        <p>Tu imagen aparecerá aquí</p>
                    </div>
                    <div class="loading" id="loading">
                        <div class="spinner"></div>
                        <p>Creando diseño...</p>
                    </div>
                    <div class="image-with-text" id="imageWithText" style="display: none;">
                        <img class="generated-image loaded" id="generatedImage" alt="Generated design">
                        <div class="text-overlay" id="textOverlay"></div>
                    </div>
                </div>

                <div class="size-selector">
                    <label>Tamaño:</label>
                    <select id="sizeSelect">
                        <option value="768">Normal (768px)</option>
                        <option value="1024">Grande (1024px)</option>
                        <option value="2048">XL - Playera (2048px)</option>
                        <option value="3000">Print (3000px)</option>
                    </select>
                </div>

                <div class="download-options">
                    <button class="btn" onclick="downloadImage()">Diseño Completo</button>
                    <button class="btn" onclick="downloadImageOnly()">Solo Imagen</button>
                    <button class="btn" onclick="downloadTransparent()">Print Then Cut</button>
                </div>
            </div>
        </div>
    </div>

        // Flatten for backward compatibility
        function getAllQuotes() {
            const all = [];
            for (const category in quoteData) {
                quoteData[category].forEach(item => {
                    all.push({ ...item, category });
                });
            }
            return all;
        }

        let currentQuote = '';
        let currentCategory = '';
        let currentImagePrompt = '';
        let currentLoadedImage = null;
        let textStyle = 'solid'; // 'solid' or 'outline'
        let currentQuoteData = null;

        function getRandom(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function getQuotesByCategory(category) {
            if (category === 'all') return getAllQuotes();
            return quoteData[category] ? quoteData[category].map(item => ({ ...item, category })) : getAllQuotes();
        }

        function generateQuote() {
            const category = document.getElementById('categorySelect').value;
            const quoteList = getQuotesByCategory(category);
            currentQuoteData = getRandom(quoteList);
            currentQuote = currentQuoteData.text;
            currentImagePrompt = currentQuoteData.image;
            currentCategory = currentQuoteData.category || category;

            document.getElementById('quoteText').textContent = `"${currentQuote}"`;
            document.getElementById('quoteCategory').textContent = currentCategory.toUpperCase();
        }

        function refreshQuote() {
            generateQuote();
        }

        function generateImage() {
            const placeholder = document.getElementById('placeholder');
            const loading = document.getElementById('loading');
            const img = document.getElementById('generatedImage');
            const imageWithText = document.getElementById('imageWithText');
            const textOverlay = document.getElementById('textOverlay');

            if (!currentQuote || !currentImagePrompt) {
                generateQuote();
            }

            // Build prompt using the matching image description
            // Safety: explicitly avoid copyrighted content, enforce original art
            const prompt = `A cartoon illustration about the phrase "${currentQuote}": ${currentImagePrompt}. The image must clearly represent the meaning of the phrase. Cartoon style, funny, vibrant colors, bold lines, centered, solid color background, NO TEXT, no words, no letters, illustration only, original artwork, no copyrighted characters, no brand logos`;

            // Show loading
            placeholder.style.display = 'none';
            imageWithText.style.display = 'none';
            loading.classList.add('active');

            // Use Hugging Face FLUX.1-schnell (free tier)
            const HF_TOKEN = getHFToken();
            if (!HF_TOKEN) {
                loading.classList.remove('active');
                placeholder.style.display = 'block';
                placeholder.innerHTML = '<div class="placeholder-icon">&#128273;</div><p>Necesitas un token de Hugging Face.<br>Es gratis!</p>';
                return;
            }
            const HF_URL = 'https://router.huggingface.co/hf-inference/models/black-forest-labs/FLUX.1-schnell';

            fetch(HF_URL, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${HF_TOKEN}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ inputs: prompt })
            })
            .then(response => {
                if (!response.ok) {
                    return response.text().then(text => {
                        throw new Error(`HTTP ${response.status}: ${text.substring(0, 200)}`);
                    });
                }
                return response.blob();
            })
            .then(blob => {
                if (blob.size < 1000) {
                    throw new Error('Image too small, probably an error response');
                }
                const blobUrl = URL.createObjectURL(blob);
                const tempImg = new Image();
                tempImg.onload = function() {
                    currentLoadedImage = tempImg;
                    img.src = blobUrl;
                    textOverlay.textContent = currentQuote;
                    imageWithText.style.display = 'inline-block';
                    loading.classList.remove('active');
                };
                tempImg.onerror = function() {
                    loading.classList.remove('active');
                    placeholder.style.display = 'block';
                    placeholder.innerHTML = '<div class="placeholder-icon">&#9888;</div><p>Error cargando imagen.</p>';
                };
                tempImg.src = blobUrl;
            })
            .catch(error => {
                console.error('Image generation error:', error);
                loading.classList.remove('active');
                placeholder.style.display = 'block';
                placeholder.innerHTML = '<div class="placeholder-icon">&#9888;</div><p>Error: ' + error.message.substring(0, 100) + '</p>';
            });
        }

        // Token management - stored in browser, never in code
        function getHFToken() {
            return localStorage.getItem('hf_token');
        }

        function setupToken() {
            const token = prompt('Pega tu token de Hugging Face aquí:\n\n(Gratis en huggingface.co/settings/tokens)');
            if (token && token.startsWith('hf_')) {
                localStorage.setItem('hf_token', token);
                showNotice('Token guardado!');
                return true;
            } else if (token) {
                alert('Token inválido. Debe empezar con "hf_"');
                return false;
            }
            return false;
        }

        // Auto-prompt for token on first visit
        if (!getHFToken()) {
            setupToken();
        }

        function regenerateImage() {
            generateImage();
        }

        function copyQuote() {
            navigator.clipboard.writeText(currentQuote);
            showNotice('Copiado!');
        }

        function showNotice(text) {
            const notice = document.getElementById('copyNotice');
            notice.textContent = text;
            notice.classList.add('show');
            setTimeout(() => notice.classList.remove('show'), 2000);
        }

        function generateAll() {
            generateQuote();
            setTimeout(() => generateImage(), 100);
        }

        // Text style toggle
        function setTextStyle(style) {
            textStyle = style;
            document.getElementById('solidBtn').classList.toggle('active', style === 'solid');
            document.getElementById('outlineBtn').classList.toggle('active', style === 'outline');
        }

        // Get selected size
        function getSelectedSize() {
            return parseInt(document.getElementById('sizeSelect').value);
        }

        // Download SVG (for vinyl cutting)
        function downloadSVG() {
            if (!currentQuote) {
                showNotice('Genera una frase primero!');
                return;
            }

            const size = getSelectedSize();
            const fontSize = size * 0.08;

            let textElement;
            if (textStyle === 'outline') {
                textElement = `<text x="50%" y="50%"
                    font-family="Impact, Arial Black, sans-serif"
                    font-size="${fontSize}"
                    font-weight="bold"
                    fill="none"
                    stroke="black"
                    stroke-width="3"
                    text-anchor="middle"
                    dominant-baseline="middle">${escapeHtml(currentQuote)}</text>`;
            } else {
                textElement = `<text x="50%" y="50%"
                    font-family="Impact, Arial Black, sans-serif"
                    font-size="${fontSize}"
                    font-weight="bold"
                    fill="black"
                    text-anchor="middle"
                    dominant-baseline="middle">${escapeHtml(currentQuote)}</text>`;
            }

            const svg = `<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    ${textElement}
</svg>`;

            const blob = new Blob([svg], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.download = 'cut-text.svg';
            link.href = url;
            link.click();
            URL.revokeObjectURL(url);
            showNotice('SVG Bajado!');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Download text as PNG with transparent background
        function downloadTextPNG() {
            if (!currentQuote) {
                showNotice('Genera una frase primero!');
                return;
            }

            const size = getSelectedSize();
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            // Transparent background (no fill)
            ctx.clearRect(0, 0, size, size);

            // Calculate font size based on canvas size
            const fontSize = size * 0.08;
            ctx.font = `bold ${fontSize}px Impact, Arial Black, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // Word wrap for long quotes
            const words = currentQuote.split(' ');
            const lines = [];
            let currentLine = '';
            const maxWidth = size * 0.85;

            for (const word of words) {
                const testLine = currentLine + (currentLine ? ' ' : '') + word;
                const metrics = ctx.measureText(testLine);
                if (metrics.width > maxWidth && currentLine) {
                    lines.push(currentLine);
                    currentLine = word;
                } else {
                    currentLine = testLine;
                }
            }
            lines.push(currentLine);

            // Draw text
            const lineHeight = fontSize * 1.2;
            const startY = (size - (lines.length - 1) * lineHeight) / 2;

            lines.forEach((line, i) => {
                const y = startY + i * lineHeight;
                if (textStyle === 'outline') {
                    ctx.strokeStyle = 'black';
                    ctx.lineWidth = size * 0.006;
                    ctx.strokeText(line, size / 2, y);
                } else {
                    // Outline for visibility
                    ctx.strokeStyle = 'white';
                    ctx.lineWidth = size * 0.012;
                    ctx.strokeText(line, size / 2, y);
                    // Fill
                    ctx.fillStyle = 'black';
                    ctx.fillText(line, size / 2, y);
                }
            });

            const link = document.createElement('a');
            link.download = 'cut-text.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
            showNotice('Texto PNG Bajado!');
        }

        // Helper function to get image for canvas operations
        function loadImageForCanvas() {
            return new Promise((resolve, reject) => {
                if (!currentLoadedImage) {
                    reject(new Error('No image loaded'));
                    return;
                }
                // Blob URLs don't have CORS issues, resolve directly
                if (currentLoadedImage.complete && currentLoadedImage.naturalWidth > 0) {
                    resolve(currentLoadedImage);
                } else {
                    reject(new Error('Image not loaded'));
                }
            });
        }

        // Download image only (no text)
        async function downloadImageOnly() {
            if (!currentLoadedImage) {
                showNotice('Genera una imagen primero!');
                return;
            }

            showNotice('Preparando descarga...');

            try {
                const size = getSelectedSize();
                const img = await loadImageForCanvas();

                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');

                ctx.drawImage(img, 0, 0, size, size);

                const link = document.createElement('a');
                link.download = 'design-image-only.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                showNotice('Imagen Bajada!');
            } catch (error) {
                console.error('Download error:', error);
                showNotice('Error - intenta generar nueva imagen');
            }
        }

        // Download for Print Then Cut (high quality with text)
        async function downloadTransparent() {
            if (!currentLoadedImage || !currentQuote) {
                showNotice('Genera un diseño primero!');
                return;
            }

            showNotice('Preparando Print Then Cut...');

            try {
                const size = getSelectedSize();
                const img = await loadImageForCanvas();

                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');

                // Draw image
                ctx.drawImage(img, 0, 0, size, size);

                // Draw text with word wrap
                const fontSize = size * 0.08;
                ctx.font = `bold ${fontSize}px Impact, Arial Black, sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                const words = currentQuote.split(' ');
                const lines = [];
                let currentLine = '';
                const maxWidth = size * 0.85;

                for (const word of words) {
                    const testLine = currentLine + (currentLine ? ' ' : '') + word;
                    const metrics = ctx.measureText(testLine);
                    if (metrics.width > maxWidth && currentLine) {
                        lines.push(currentLine);
                        currentLine = word;
                    } else {
                        currentLine = testLine;
                    }
                }
                lines.push(currentLine);

                const lineHeight = fontSize * 1.2;
                const startY = (size - (lines.length - 1) * lineHeight) / 2;

                lines.forEach((line, i) => {
                    const y = startY + i * lineHeight;
                    // Black outline
                    ctx.strokeStyle = 'black';
                    ctx.lineWidth = size * 0.012;
                    ctx.strokeText(line, size / 2, y);
                    // White fill
                    ctx.fillStyle = 'white';
                    ctx.fillText(line, size / 2, y);
                });

                const link = document.createElement('a');
                link.download = 'print-then-cut.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                showNotice('Print Then Cut Listo!');
            } catch (error) {
                console.error('Download error:', error);
                showNotice('Error - intenta generar nueva imagen');
            }
        }

        // Download full design (image + text) - Diseño Completo
        async function downloadImage() {
            if (!currentLoadedImage || !currentQuote) {
                showNotice('Genera un diseño primero!');
                return;
            }

            showNotice('Preparando diseño...');

            try {
                const size = getSelectedSize();
                const img = await loadImageForCanvas();

                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');

                ctx.drawImage(img, 0, 0, size, size);

                const fontSize = size * 0.078;
                ctx.font = `bold ${fontSize}px Impact, Arial Black, sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                // Word wrap
                const words = currentQuote.split(' ');
                const lines = [];
                let currentLine = '';
                const maxWidth = size * 0.85;

                for (const word of words) {
                    const testLine = currentLine + (currentLine ? ' ' : '') + word;
                    const metrics = ctx.measureText(testLine);
                    if (metrics.width > maxWidth && currentLine) {
                        lines.push(currentLine);
                        currentLine = word;
                    } else {
                        currentLine = testLine;
                    }
                }
                lines.push(currentLine);

                const lineHeight = fontSize * 1.2;
                const startY = (size - (lines.length - 1) * lineHeight) / 2;

                lines.forEach((line, i) => {
                    const y = startY + i * lineHeight;
                    ctx.strokeStyle = 'black';
                    ctx.lineWidth = size * 0.01;
                    ctx.strokeText(line, size / 2, y);
                    ctx.fillStyle = 'white';
                    ctx.fillText(line, size / 2, y);
                });

                const link = document.createElement('a');
                link.download = 'design.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                showNotice('Bajado!');
            } catch (error) {
                console.error('Download error:', error);
                showNotice('Error - intenta generar nueva imagen');
            }
        }

        document.getElementById('generateBtn').addEventListener('click', generateAll);

        // PWA Install prompt
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installBtn').style.display = 'inline-block';
        });

        function installApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(result => {
                    if (result.outcome === 'accepted') {
                        showNotice('App instalada!');
                    }
                    deferredPrompt = null;
                    document.getElementById('installBtn').style.display = 'none';
                });
            }
        }

        // Register service worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./service-worker.js')
                .then(reg => console.log('SW registered'))
                .catch(err => console.log('SW registration failed:', err));
        }
    </script>
